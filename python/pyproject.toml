[project]
name = "checkout-strategy"
version = "1.0.0"
description = "Strategy pattern demo: pluggable shipping-cost algorithms in a checkout."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
