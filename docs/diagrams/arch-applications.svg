<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif" fill="#1B1F23">
<title id="t">Strategy beyond the class diagram</title>
<desc id="d">Four architecture-level applications of the Strategy pattern, one panel each. 1: behind a port, a hexagonal Checkout core owns a port that Carrier A, Carrier B and a test fake implement; config injects the adapter. 2: runtime policy selection, a request reaches a selector that reads tenant, flag and config and picks one implementation of the ShippingStrategy contract (Regional, Default or a canary), with a red fallback on error. 3: across service boundaries, Checkout calls the quote(order) contract across a service boundary; the rate-quote service implements it, fans out to carrier strategies and returns the cheapest valid quote, and Checkout falls back to a flat rate when the deadline is hit. 4: pluggable pipeline steps, the Score stage asks an assignment selector that picks by bucket one implementation of the predict(features) contract (Model v1 or Model v2); the model id is logged with the outcome.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="#3D4650"/></marker>
<marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1 L10 5 L0 9 Z" fill="#A5222B"/></marker>
<marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF" stroke="#3D4650" stroke-width="1.8" stroke-linejoin="round"/></marker>
</defs>
