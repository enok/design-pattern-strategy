<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" fill="#1B1F23">
<title>Strategy behind a port (hexagonal architecture)</title>
<desc>Hexagonal architecture: the Checkout use case (Context) and Order value object in the application core; the ShippingRatePort driven port (the example's ShippingStrategy) on the right edge is implemented by Carrier A, Carrier B and Store pickup adapters; the composition root selects the adapter at startup.</desc>
