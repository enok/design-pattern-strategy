name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  java:
    name: java
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: java/pom.xml
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Run demo
        run: java -cp target/classes io.github.enok.patterns.strategy.Demo

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Docs checker unit tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: Code-by-component page is up to date
        run: python .github/scripts/gen_code_by_component.py --check
      - name: Check links, diagram drift and code drift
        run: python .github/scripts/check_docs.py
